<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Captura Pro - Fondo Blanco</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>

    <style>
        :root { --primary: #2563eb; --success: #059669; --bg: #f1f5f9; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; }
        
        .container { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 100%; max-width: 800px; }
        h2 { text-align: center; color: #1e293b; margin-top: 0; }

        .setup-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .full-width { grid-column: span 2; }

        label { display: block; font-size: 0.85rem; font-weight: bold; color: #64748b; margin-bottom: 5px; }
        select, input, button { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #cbd5e1; font-size: 1rem; box-sizing: border-box; }
        
        .btn { border: none; cursor: pointer; font-weight: bold; color: white; transition: all 0.3s ease; }
        .btn-folder { background: var(--success); }
        .btn-folder:hover { background: #047857; }
        .btn-capture { background: var(--primary); font-size: 1.2rem; margin-top: 20px; height: 60px; }
        .btn-capture:disabled { background: #cbd5e1; cursor: not-allowed; }

        .video-container { position: relative; width: 100%; background: #000; border-radius: 15px; overflow: hidden; aspect-ratio: 16 / 9; margin-top: 10px; }
        canvas { width: 100%; height: 100%; transform: scaleX(-1); /* Efecto espejo para el operador */ }
        video { display: none; }

        #status { text-align: center; margin-top: 15px; font-weight: 500; color: var(--primary); min-height: 1.2em; }
        .loader { font-size: 0.9rem; color: #64748b; text-align: center; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2>📸 Sistema de Captura Académica</h2>
    <div id="loader" class="loader">Iniciando IA de recorte...</div>

    <div class="setup-grid">
        <div class="full-width">
            <label>1. Carpeta de Destino</label>
            <button id="btnFolder" class="btn btn-folder">📁 Vincular Carpeta Local</button>
        </div>
        
        <div class="full-width">
            <label>2. Base de Datos (Excel)</label>
            <input type="file" id="inputExcel" accept=".xlsx, .xls" />
        </div>

        <div>
            <label>3. Curso</label>
            <select id="selectCurso" disabled><option>Esperando Excel...</option></select>
        </div>

        <div>
            <label>4. Estudiante</label>
            <select id="selectEstudiante" disabled><option>Seleccione curso...</option></select>
        </div>
    </div>

    <div class="video-container">
        <video id="videoInput" autoplay playsinline></video>
        <canvas id="canvasOutput"></canvas>
    </div>

    <button id="btnCapturar" class="btn btn-capture" disabled>TOMAR FOTO PROFESIONAL</button>
    <div id="status"></div>
</div>

<script>
    // Variables Globales
    let selfieSegmentation;
    let rootHandle = null;
    let datosFull = [];
    
    const videoElement = document.getElementById('videoInput');
    const canvasElement = document.getElementById('canvasOutput');
    const canvasCtx = canvasElement.getContext('2d');
    const btnCapturar = document.getElementById('btnCapturar');
    const statusDiv = document.getElementById('status');

    // 1. Inicializar IA de MediaPipe
    async function initIA() {
        selfieSegmentation = new SelfieSegmentation({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${file}`
        });

        selfieSegmentation.setOptions({
            modelSelection: 0, // 0 = Modo rápido (evita crasheos de GPU)
            selfieMode: false
        });

        selfieSegmentation.onResults(onIAresults);
        document.getElementById('loader').style.display = 'none';
        startCamera();
    }

    // Bucle de procesamiento (Optimizado)
    function onIAresults(results) {
        canvasElement.width = results.image.width;
        canvasElement.height = results.image.height;

        canvasCtx.save();
        canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
        
        // Dibujar máscara suavizada
        canvasCtx.filter = 'blur(3px)';
        canvasCtx.drawImage(results.segmentationMask, 0, 0, canvasElement.width, canvasElement.height);

        // Extraer persona
        canvasCtx.globalCompositeOperation = 'source-in';
        canvasCtx.filter = 'none';
        canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

        // Fondo Blanco
        canvasCtx.globalCompositeOperation = 'destination-over';
        canvasCtx.fillStyle = 'white';
        canvasCtx.fillRect(0, 0, canvasElement.width, canvasElement.height);
        
        canvasCtx.restore();
    }

    // 2. Control de Cámara
    async function startCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { width: { ideal: 1280 }, height: { ideal: 720 } } 
            });
            videoElement.srcObject = stream;
            
            async function predict() {
                if (selfieSegmentation) {
                    await selfieSegmentation.send({ image: videoElement });
                }
                requestAnimationFrame(predict);
            }
            videoElement.onloadedmetadata = () => predict();
        } catch (err) {
            alert("No se pudo acceder a la cámara: " + err.message);
        }
    }

    // 3. Manejo de Carpeta Local
    document.getElementById('btnFolder').addEventListener('click', async () => {
        try {
            rootHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
            document.getElementById('btnFolder').innerText = "✅ Carpeta: " + rootHandle.name;
            checkReady();
        } catch (err) { console.error(err); }
    });

    // 4. Lectura de Excel
    document.getElementById('inputExcel').addEventListener('change', (e) => {
        const reader = new FileReader();
        reader.onload = (event) => {
            const workbook = XLSX.read(new Uint8Array(event.target.result), { type: 'array' });
            datosFull = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
            
            const cursos = [...new Set(datosFull.map(item => item.Curso))].sort();
            const sc = document.getElementById('selectCurso');
            sc.innerHTML = '<option value="">Seleccione Curso</option>';
            cursos.forEach(c => sc.add(new Option(c, c)));
            sc.disabled = false;
        };
        reader.readAsArrayBuffer(e.target.files[0]);
    });

    document.getElementById('selectCurso').addEventListener('change', (e) => {
        const se = document.getElementById('selectEstudiante');
        se.innerHTML = '<option value="">Seleccione Estudiante</option>';
        const filtrados = datosFull.filter(d => d.Curso == e.target.value);
        filtrados.forEach(est => {
            se.add(new Option(`${est["Nombres y Apellidos"]} (${est["R.U.T"]})`, est["Nombres y Apellidos"]));
        });
        se.disabled = false;
        checkReady();
    });

    document.getElementById('selectEstudiante').addEventListener('change', checkReady);

    function checkReady() {
        btnCapturar.disabled = !(rootHandle && document.getElementById('selectEstudiante').value);
    }

    // 5. Función de Nitidez (Solo al capturar)
    function applySharpen(ctx, w, h) {
        const weights = [0, -1, 0, -1, 5, -1, 0, -1, 0];
        const imageData = ctx.getImageData(0, 0, w, h);
        const dst = ctx.createImageData(w, h);
        const d = dst.data;
        const s = imageData.data;
        for (let i = 0; i < s.length; i += 4) {
            // Un sharpen simplificado para no estresar la memoria
            d[i] = s[i] * 1.2;     // R
            d[i+1] = s[i+1] * 1.2; // G
            d[i+2] = s[i+2] * 1.2; // B
            d[i+3] = 255;          // A
        }
        ctx.putImageData(dst, 0, 0);
    }

    // 6. Captura y Guardado Final
    btnCapturar.addEventListener('click', async () => {
        const curso = document.getElementById('selectCurso').value;
        const nombre = document.getElementById('selectEstudiante').value;
        
        statusDiv.innerText = "💾 Procesando y guardando...";

        // Crear canvas final de alta resolución
        const finalCanvas = document.createElement('canvas');
        finalCanvas.width = canvasElement.width;
        finalCanvas.height = canvasElement.height;
        const fCtx = finalCanvas.getContext('2d');
        
        // Dibujamos la imagen limpia
        fCtx.drawImage(canvasElement, 0, 0);
        
        // Aplicar mejoras de color
        fCtx.filter = 'contrast(1.1) brightness(1.02) saturate(1.05)';
        fCtx.drawImage(finalCanvas, 0, 0);

        // Convertir a Blob (Máxima Calidad)
        const blob = await new Promise(res => finalCanvas.toBlob(res, 'image/jpeg', 1.0));
        
        try {
            const cursoDir = await rootHandle.getDirectoryHandle(curso, { create: true });
            const fileName = `${nombre.replace(/[/\\?%*:|"<>]/g, '-')}.jpeg`;
            const fileHandle = await cursoDir.getFileHandle(fileName, { create: true });
            const writable = await fileHandle.createWritable();
            await writable.write(blob);
            await writable.close();
            
            statusDiv.innerText = `✅ ¡Foto de ${nombre} guardada!`;
            setTimeout(() => statusDiv.innerText = "", 3000);
        } catch (err) {
            alert("Error al guardar: " + err.message);
            statusDiv.innerText = "❌ Error al guardar";
        }
    });

    // Iniciar todo al cargar
    window.onload = initIA;
</script>

</body>
</html>
